<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Playlist Bar</title>

    <style>
      body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: white;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      /* Playlist Container */
      .playlist {
        display: flex;
        gap: 20px;
        justify-content: center;
      }

      /* Song Card */
      .song-card {
        display: flex;
        align-items: center; /* Vertically centers the text */
        width: 220px;
        height: 80px;
        background-color: #1db954;
        color: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: 0.3s;
      }

      .song-card:hover {
        transform: scale(1.05);
        background-color: #1ed760;
      }

      .song-info h3 {
        margin: 0;
        font-size: 18px;
      }

      .song-info p {
        margin: 5px 0 0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>🎵 Spotify Playlist</h1>

    <div class="playlist">
      <div class="song-card">
        <div class="song-info">
          <h3>Perfect</h3>
          <p>Ed Sheeran</p>
        </div>
      </div>

      <div class="song-card">
        <div class="song-info">
          <h3>Believer</h3>
          <p>Imagine Dragons</p>
        </div>
      </div>

      <div class="song-card">
        <div class="song-info">
          <h3>Blinding Lights</h3>
          <p>The Weeknd</p>
        </div>
      </div>

      <div class="song-card">
        <div class="song-info">
          <h3>Shape of You</h3>
          <p>Ed Sheeran</p>
        </div>
      </div>

      <div class="song-card">
        <div class="song-info">
          <h3>Heat Waves</h3>
          <p>Glass Animals</p>
        </div>
      </div>
    </div>
  </body>
</html>
