<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Grid</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f1f3f6;
        padding: 30px;
      }

      h1 {
        text-align: center;
        color: #2874f0;
        margin-bottom: 30px;
      }

      /* Product Grid */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        max-width: 1000px;
        margin: auto;
      }

      /* Product Card */
      .product-card {
        background-color: white;
        border-radius: 10px;
        padding: 15px;
        text-align: center;
        border: 1px solid #ddd;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
      }

      .product-card img {
        height: 180px;
        object-fit: cover;
        margin-bottom: 15px;
        border-radius: 8px;
      }

      .product-card h3 {
        color: #333;
        margin-bottom: 10px;
      }

      .product-card p {
        color: #388e3c;
        font-size: 18px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>🛒 Flipkart Product Grid</h1>

    <section class="product-grid">
      <div class="product-card">
        <img
          src="https://www.boat-lifestyle.com/cdn/shop/files/Artboard2_52206726-98d5-45a4-b521-f034ec83e7b6.png?v=1752729573"
          alt="Product 1"
        />
        <h3>Wireless Headphones</h3>
        <p>₹1,999</p>
      </div>

      <div class="product-card">
        <img
          src="https://www.boat-lifestyle.com/cdn/shop/files/Artboard_10_3e8ce994-39ac-4443-b0df-d570bcdaf6b3_1800x.png?v=1734592384"
          alt="Product 2"
        />
        <h3>Smart Watch</h3>
        <p>₹2,499</p>
      </div>

      <div class="product-card">
        <img
          src="https://www.portronics.com/cdn/shop/files/portronics_sound_drum_p_mobile_speaker.jpg?v=1732797960"
          alt="Product 3"
        />
        <h3>Bluetooth Speaker</h3>
        <p>₹1,499</p>
      </div>

      <div class="product-card">
        <img
          src="https://m.media-amazon.com/images/I/61Mk3YqYHpL.jpg"
          alt="Product 4"
        />
        <h3>Gaming Mouse</h3>
        <p>₹799</p>
      </div>

      <div class="product-card">
        <img
          src="https://m.media-amazon.com/images/I/71ZQjdvguTL._AC_UF1000,1000_QL80_.jpg"
          alt="Product 5"
        />
        <h3>USB Keyboard</h3>
        <p>₹999</p>
      </div>

      <div class="product-card">
        <img
          src="https://www.boat-lifestyle.com/cdn/shop/files/PB_300Pro_FI_Green_01_740ef79f-2650-48bf-a584-a156f7b05084.jpg?v=1725982757"
          alt="Product 6"
        />
        <h3>Power Bank</h3>
        <p>₹1,299</p>
      </div>
    </section>
  </body>
</html>
