<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Responsive BookMyShow Layout</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      .movie-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .movie-title {
        color: #d81b60;
        font-weight: bold;
      }

      .rating {
        color: #28a745;
        font-size: 20px;
        font-weight: bold;
      }

      .btn-book {
        background: #f84464;
        color: white;
        border: none;
      }

      .btn-book:hover {
        background: #d63352;
        color: white;
      }

      .movie-poster {
        width: 100%;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <div class="row movie-card p-4 align-items-center">
        <!-- Movie Poster -->
        <div class="col-12 col-md-6 text-center mb-4 mb-md-0">
          <img
            src="https://m.media-amazon.com/images/I/91EmWoPK3+L.jpg"
            class="img-fluid movie-poster"
            alt="Movie Poster"
          />
        </div>

        <!-- Movie Details -->
        <div class="col-12 col-md-6">
          <h2 class="movie-title">Avengers: Endgame</h2>

          <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>

          <p class="rating">⭐ 4.8 / 5</p>

          <p>
            Avengers: Endgame is an epic superhero movie featuring Earth's
            mightiest heroes in the final battle against Thanos.
          </p>

          <button class="btn btn-book btn-lg">Book Now</button>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
