<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Meta Viewport for Mobile Responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flipkart Product Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f1f3f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .product-card {
        width: 300px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        transition: 0.3s;
      }

      .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
      }

      .product-card img {
        width: 100%;
        height: 250px;
        object-fit: cover;
      }

      .product-details {
        padding: 15px;
      }

      .product-details h2 {
        font-size: 20px;
        margin-bottom: 10px;
        color: #212121;
      }

      .price {
        color: #388e3c;
        font-size: 22px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .description {
        color: #666;
        font-size: 14px;
        margin-bottom: 15px;
      }

      .buy-btn {
        width: 100%;
        padding: 12px;
        border: none;
        background: #2874f0;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }

      .buy-btn:hover {
        background: #1c5ec8;
      }

      /* Mobile Responsive */
      @media (max-width: 480px) {
        .product-card {
          width: 100%;
        }

        .product-details h2 {
          font-size: 18px;
        }

        .price {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="product-card">
      <img
        src="https://www.boat-lifestyle.com/cdn/shop/files/Artboard2_52206726-98d5-45a4-b521-f034ec83e7b6.png?v=1752729573"
        alt="Wireless Headphones"
      />

      <div class="product-details">
        <h2>Wireless Bluetooth Headphones</h2>

        <p class="price">₹1,999</p>

        <p class="description">
          Premium sound quality with noise cancellation and 40-hour battery
          life.
        </p>

        <button class="buy-btn">Buy Now</button>
      </div>
    </div>
  </body>
</html>
