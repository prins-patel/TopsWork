<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive Meta Tag -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Responsive Product Card</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #f1f3f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Product Card */
      .product-card {
        display: flex;
        width: 700px;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      /* Product Image */
      .product-image {
        flex: 1;
      }

      .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* Product Details */
      .product-details {
        flex: 1;
        padding: 30px;
      }

      .product-details h2 {
        font-size: 30px;
        margin-bottom: 15px;
        color: #212121;
      }

      .price {
        font-size: 28px;
        color: #388e3c;
        font-weight: bold;
        margin-bottom: 15px;
      }

      .description {
        font-size: 18px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .buy-btn {
        background: #2874f0;
        color: white;
        border: none;
        padding: 12px 25px;
        font-size: 18px;
        border-radius: 5px;
        cursor: pointer;
      }

      .buy-btn:hover {
        background: #1c5ec8;
      }

      /* ===============================
           Breakpoint 1 (1200px)
        ================================ */
      @media only screen and (max-width: 1200px) {
        .product-details {
          padding: 25px;
        }

        .product-details h2 {
          font-size: 28px;
        }

        .description {
          font-size: 17px;
        }

        .buy-btn {
          font-size: 17px;
        }
      }

      /* ===============================
           Breakpoint 2 (900px)
        ================================ */
      @media only screen and (max-width: 900px) {
        .product-card {
          width: 90%;
        }

        .product-details {
          padding: 20px;
        }

        .product-details h2 {
          font-size: 24px;
        }

        .price {
          font-size: 24px;
        }

        .description {
          font-size: 16px;
        }

        .buy-btn {
          font-size: 16px;
        }
      }

      /* ===============================
           Breakpoint 3 (600px)
        ================================ */
      @media only screen and (max-width: 600px) {
        .product-card {
          flex-direction: column;
        }

        .product-details {
          padding: 15px;
          text-align: center;
        }

        .product-details h2 {
          font-size: 20px;
        }

        .price {
          font-size: 20px;
        }

        .description {
          font-size: 14px;
        }

        .buy-btn {
          width: 100%;
          font-size: 15px;
          padding: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="product-card">
      <div class="product-image">
        <img
          src="https://www.boat-lifestyle.com/cdn/shop/files/Artboard2_52206726-98d5-45a4-b521-f034ec83e7b6.png?v=1752729573"
          alt="Wireless Headphones"
        />
      </div>

      <div class="product-details">
        <h2>Wireless Bluetooth Headphones</h2>

        <p class="price">₹1,999</p>

        <p class="description">
          Premium sound quality with active noise cancellation, 40-hour battery
          life, and comfortable over-ear design.
        </p>

        <button class="buy-btn">Buy Now</button>
      </div>
    </div>
  </body>
</html>
