<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyShow Featured Movies</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f5f5;
      }

      h1 {
        text-align: center;
        color: #d81b60;
        margin: 30px 0;
      }

      .carousel {
        max-width: 700px;
        margin: auto;
      }

      .carousel-item img {
        height: 500px;
        object-fit: cover;
        border-radius: 10px;
      }

      .carousel-caption {
        background: rgba(0, 0, 0, 0.6);
        border-radius: 8px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>🎬 BookMyShow Featured Movies</h1>

    <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">
      <!-- Indicators -->
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#movieCarousel"
          data-bs-slide-to="0"
          class="active"
        ></button>
        <button
          type="button"
          data-bs-target="#movieCarousel"
          data-bs-slide-to="1"
        ></button>
        <button
          type="button"
          data-bs-target="#movieCarousel"
          data-bs-slide-to="2"
        ></button>
      </div>

      <div class="carousel-inner">
        <!-- Movie 1 -->
        <div class="carousel-item active">
          <img
            src="https://image.tmdb.org/t/p/w780/or06FN3Dka5tukK1e9sl16pB3iy.jpg"
            class="d-block w-100"
            alt="Avengers Endgame"
          />

          <div class="carousel-caption">
            <h5>Avengers: Endgame</h5>
            <p>⭐ Action | Adventure | Sci-Fi</p>
          </div>
        </div>

        <!-- Movie 2 -->
        <div class="carousel-item">
          <img
            src="https://image.tmdb.org/t/p/w780/iQFcwSGbZXMkeyKrxbPnwnRo5fl.jpg"
            class="d-block w-100"
            alt="Spider-Man No Way Home"
          />

          <div class="carousel-caption">
            <h5>Spider-Man: No Way Home</h5>
            <p>🕷️ Action | Adventure | Fantasy</p>
          </div>
        </div>

        <!-- Movie 3 -->
        <div class="carousel-item">
          <img
            src="https://image.tmdb.org/t/p/w780/9Gtg2DzBhmYamXBS1hKAhiwbBKS.jpg"
            class="d-block w-100"
            alt="Doctor Strange"
          />

          <div class="carousel-caption">
            <h5>Doctor Strange in the Multiverse of Madness</h5>
            <p>✨ Fantasy | Adventure | Action</p>
          </div>
        </div>
      </div>

      <!-- Previous -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#movieCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <!-- Next -->
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#movieCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
