<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Card</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f1f3f6;
      }

      .card {
        transition: 0.3s;
        border: none;
        border-radius: 10px;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .price {
        color: #388e3c;
        font-size: 24px;
        font-weight: bold;
      }

      .btn-buy {
        background-color: #2874f0;
        color: white;
      }

      .btn-buy:hover {
        background-color: #1c5ec8;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card">
            <img
              src="https://www.boat-lifestyle.com/cdn/shop/files/Artboard2_52206726-98d5-45a4-b521-f034ec83e7b6.png?v=1752729573"
              class="card-img-top"
              alt="Wireless Headphones"
            />

            <div class="card-body text-center">
              <h4 class="card-title">Wireless Bluetooth Headphones</h4>

              <p class="price">₹1,999</p>

              <p class="card-text">
                Premium sound quality with noise cancellation and 40-hour
                battery life.
              </p>

              <a href="#" class="btn btn-buy w-100"> Buy Now </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
