<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Showcase</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f1f3f6;
      }

      h2 {
        color: #2874f0;
        font-weight: bold;
      }

      .card {
        border: none;
        border-radius: 12px;
        transition: 0.3s;
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }

      .card img {
        height: 220px;
        object-fit: cover;
      }

      .price {
        color: #388e3c;
        font-size: 22px;
        font-weight: bold;
      }

      .btn-buy {
        background: #2874f0;
        color: white;
      }

      .btn-buy:hover {
        background: #1c5ec8;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <h2 class="text-center mb-5">🛒 Flipkart Product Showcase</h2>

      <div class="row g-4">
        <!-- Product 1 -->
        <div class="col-6 col-md-3">
          <div class="card h-100">
            <img
              src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600"
              class="card-img-top"
              alt="Headphones"
            />

            <div class="card-body text-center">
              <h5 class="card-title">Wireless Headphones</h5>
              <p class="price">₹1,999</p>
              <a href="#" class="btn btn-buy w-100">Buy Now</a>
            </div>
          </div>
        </div>

        <!-- Product 2 -->
        <div class="col-6 col-md-3">
          <div class="card h-100">
            <img
              src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=600"
              class="card-img-top"
              alt="Smart Watch"
            />

            <div class="card-body text-center">
              <h5 class="card-title">Smart Watch</h5>
              <p class="price">₹2,499</p>
              <a href="#" class="btn btn-buy w-100">Buy Now</a>
            </div>
          </div>
        </div>

        <!-- Product 3 -->
        <div class="col-6 col-md-3">
          <div class="card h-100">
            <img
              src="https://images.unsplash.com/photo-1580894908361-967195033215?w=600"
              class="card-img-top"
              alt="Laptop"
            />

            <div class="card-body text-center">
              <h5 class="card-title">Gaming Laptop</h5>
              <p class="price">₹59,999</p>
              <a href="#" class="btn btn-buy w-100">Buy Now</a>
            </div>
          </div>
        </div>

        <!-- Product 4 -->
        <div class="col-6 col-md-3">
          <div class="card h-100">
            <img
              src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600"
              class="card-img-top"
              alt="Smartphone"
            />

            <div class="card-body text-center">
              <h5 class="card-title">Smartphone</h5>
              <p class="price">₹24,999</p>
              <a href="#" class="btn btn-buy w-100">Buy Now</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
