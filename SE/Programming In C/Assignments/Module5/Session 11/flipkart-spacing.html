<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Card</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f1f3f6;
      }

      .card {
        transition: 0.3s;
        border: none;
        border-radius: 12px;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .price {
        color: #388e3c;
        font-size: 22px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h2 class="text-center text-primary mb-4">🛒 Flipkart Product Card</h2>

      <!-- Margin Level -->
      <div class="card mx-auto m-3" style="width: 22rem">
        <!-- Padding Level -->
        <img
          src="https://www.boat-lifestyle.com/cdn/shop/files/Artboard2_52206726-98d5-45a4-b521-f034ec83e7b6.png?v=1752729573"
          class="card-img-top p-2"
          alt="Wireless Headphones"
        />

        <!-- Padding Level -->
        <div class="card-body p-4">
          <h4 class="card-title mb-2">boAt Rockerz 450 Bluetooth Headphones</h4>

          <p class="price mb-3">₹1,499</p>

          <p class="card-text">
            15 Hours Battery Backup, Lightweight Design, HD Sound, Bluetooth
            v5.0.
          </p>

          <button class="btn btn-primary px-4 py-2 w-100">Buy Now</button>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
