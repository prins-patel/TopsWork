<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Theme Switcher</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        transition: 0.3s;
      }

      .theme-box {
        min-height: 100vh;
        transition: 0.3s;
      }
    </style>
  </head>
  <body>
    <div
      id="themeContainer"
      class="container-fluid theme-box bg-light text-dark"
    >
      <div class="container py-5 text-center">
        <h1 class="mb-4">🎬 BookMyShow</h1>

        <img
          src="https://image.tmdb.org/t/p/w780/or06FN3Dka5tukK1e9sl16pB3iy.jpg"
          class="img-fluid rounded shadow mb-4"
          style="max-width: 300px"
          alt="Movie Poster"
        />

        <h3>Avengers: Endgame</h3>

        <p>⭐ 4.8/5 | Action | Adventure | Sci-Fi</p>

        <button class="btn btn-primary mb-3">🎟️ Book Ticket</button>

        <br />

        <button class="btn btn-dark" onclick="toggleTheme()">
          🌙 Switch Theme
        </button>
      </div>
    </div>

    <script>
      function toggleTheme() {
        const container = document.getElementById("themeContainer");

        container.classList.toggle("bg-light");
        container.classList.toggle("text-dark");

        container.classList.toggle("bg-dark");
        container.classList.toggle("text-light");
      }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
