<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyShow Ticket</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS (Loaded after Bootstrap) -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="card mx-auto shadow" style="width: 22rem">
        <img
          src="https://image.tmdb.org/t/p/w780/or06FN3Dka5tukK1e9sl16pB3iy.jpg"
          class="card-img-top"
          alt="Avengers Endgame"
        />

        <div class="card-body text-center">
          <h3 class="card-title">Avengers: Endgame</h3>

          <p class="card-text">⭐ 4.8/5 | Action | Adventure | Sci-Fi</p>

          <!-- Bootstrap Primary Button -->
          <button class="btn btn-primary">🎟️ Book Ticket</button>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
