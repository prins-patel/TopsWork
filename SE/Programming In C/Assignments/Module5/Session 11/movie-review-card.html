<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyShow Movie Review Card</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f5f5f5;
      }

      .card {
        border: none;
        border-radius: 15px;
        overflow: hidden;
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .movie-poster {
        height: 450px;
        object-fit: cover;
      }

      .rating-badge {
        background: #28a745;
        color: #fff;
        border-radius: 5px;
        padding: 5px 10px;
        display: inline-block;
      }

      .btn-book {
        background: #f84464;
        color: white;
      }

      .btn-book:hover {
        background: #d63352;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card">
            <img
              src="https://image.tmdb.org/t/p/w780/or06FN3Dka5tukK1e9sl16pB3iy.jpg"
              class="card-img-top movie-poster"
              alt="Avengers Endgame"
            />

            <div class="card-body">
              <!-- Bootstrap Typography Utilities -->
              <h2 class="fw-bold display-6">Avengers: Endgame</h2>

              <p class="fw-semibold fs-5 rating-badge">⭐ 4.8 / 5</p>

              <p class="text-secondary fw-normal fs-6 mt-3">
                Avengers: Endgame is an epic superhero film that brings together
                Earth's mightiest heroes for one final battle against Thanos.
                Packed with action, emotion, and stunning visual effects, it
                delivers an unforgettable cinematic experience.
              </p>

              <button class="btn btn-book w-100 mt-3">🎟️ Book Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
