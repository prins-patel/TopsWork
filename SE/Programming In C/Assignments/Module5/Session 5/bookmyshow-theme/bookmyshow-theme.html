<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyShow Movie Detail</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #ffffff;
        color: #000000;
        margin: 0;
        padding: 20px;
        transition:
          background-color 0.4s,
          color 0.4s;
      }

      header {
        background-color: #f84464;
        color: white;
        padding: 20px;
        text-align: center;
        border-radius: 8px;
      }

      .movie-card {
        margin-top: 20px;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: #f5f5f5;
      }

      button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #f84464;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #d73755;
      }

      /* Dark Mode */
      .dark-mode {
        background-color: #121212;
        color: #ffffff;
      }

      /* .dark-mode header {
        background-color: #222222;
      } */

      .dark-mode .movie-card {
        background-color: #2c2c2c;
        border-color: #555;
      }

      .dark-mode button {
        background-color: #f84464;
        color: white;
      }

      .dark-mode button:hover {
        background-color: #d73755;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎬 BookMyShow</h1>
    </header>

    <div class="movie-card">
      <h2>Avengers: Endgame</h2>
      <p><strong>Genre:</strong> Action, Adventure, Sci-Fi</p>
      <p><strong>Rating:</strong> ⭐ 4.8/5</p>
      <p>
        Avengers: Endgame is an epic superhero movie featuring the final battle
        against Thanos with spectacular action and emotional moments.
      </p>
    </div>

    <button onclick="toggleTheme()">🌙 Toggle Light / Dark Mode</button>

    <script>
      function toggleTheme() {
        document.body.classList.toggle("dark-mode");
      }
    </script>
  </body>
</html>
