<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flipkart Product Card</title>
  </head>
  <body>
    <h1>Flipkart Product Card</h1>

    <div style="border: 1px solid #ccc; width: 500px; padding: 15px">
      <img
        src="https://www.boat-lifestyle.com/cdn/shop/files/Artboard2_52206726-98d5-45a4-b521-f034ec83e7b6.png?v=1752729573"
        alt="Wireless Headphones"
        width="500"
      />

      <!-- Inline CSS applied only to the product title -->
      <h2 style="background-color: lightblue; font-size: 50px">
        Wireless Bluetooth Headphones
      </h2>

      <p><strong>Price:</strong> ₹1,999</p>

      <p>
        Enjoy high-quality sound with noise cancellation, long battery life, and
        a comfortable design.
      </p>

      <button>Buy Now</button>
    </div>
  </body>
</html>
