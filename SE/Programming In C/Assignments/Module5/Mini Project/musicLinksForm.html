<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Links Form</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #121212;
        color: white;
        font-family: Arial, sans-serif;
      }

      .form-box {
        max-width: 700px;
        margin: 40px auto;
        background: #1e1e1e;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
      }

      .preview-card {
        background: #1e1e1e;
        color: white;
        border-radius: 10px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
      }

      .preview-card a {
        text-decoration: none;
        word-break: break-all;
      }

      h2 {
        color: #1db954;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-box">
        <h2 class="text-center mb-4">🎵 Music Profile Links</h2>

        <form id="musicLinksForm">
          <div class="mb-3">
            <label class="form-label">
              <i class="bi bi-spotify"></i> Spotify Profile URL
            </label>

            <input
              type="url"
              id="spotify"
              class="form-control"
              placeholder="https://open.spotify.com/..."
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">
              <i class="bi bi-youtube"></i> YouTube Music URL
            </label>

            <input
              type="url"
              id="youtube"
              class="form-control"
              placeholder="https://music.youtube.com/..."
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">
              <i class="bi bi-apple"></i> Apple Music URL
            </label>

            <input
              type="url"
              id="apple"
              class="form-control"
              placeholder="https://music.apple.com/..."
              required
            />
          </div>

          <button type="submit" class="btn btn-success w-100">
            Submit Links
          </button>
        </form>
      </div>

      <!-- Preview Cards -->
      <div id="previewArea" class="mt-4"></div>
    </div>

    <script>
      document
        .getElementById("musicLinksForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const spotify = document.getElementById("spotify").value;
          const youtube = document.getElementById("youtube").value;
          const apple = document.getElementById("apple").value;

          document.getElementById("previewArea").innerHTML = `

        <div class="preview-card">
            <h4>🎵 Submitted Music Links</h4>
            <hr>

            <p>
                <i class="bi bi-spotify text-success"></i>
                <strong>Spotify:</strong><br>
                <a href="${spotify}" target="_blank" class="text-success">
                    ${spotify}
                </a>
            </p>

            <p>
                <i class="bi bi-youtube text-danger"></i>
                <strong>YouTube Music:</strong><br>
                <a href="${youtube}" target="_blank" class="text-danger">
                    ${youtube}
                </a>
            </p>

            <p>
                <i class="bi bi-apple"></i>
                <strong>Apple Music:</strong><br>
                <a href="${apple}" target="_blank" class="text-light">
                    ${apple}
                </a>
            </p>

        </div>

    `;
        });
    </script>
  </body>
</html>
