<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamer Tag Bio Link</title>

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b, #111827);
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .profile-card {
        width: 100%;
        max-width: 420px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 35px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      }

      .avatar {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid #00ff88;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 32px;
        color: #00ff88;
        margin-bottom: 10px;
      }

      .username {
        color: #d1d5db;
        margin-bottom: 25px;
        font-size: 18px;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-decoration: none;
        color: white;
        padding: 15px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        transition: 0.3s;
      }

      .btn:hover {
        transform: translateY(-3px);
      }

      .twitch {
        background: #9146ff;
      }

      .discord {
        background: #5865f2;
      }

      .steam {
        background: #171a21;
      }

      .btn i {
        font-size: 24px;
      }

      /* Desktop Layout */
      @media (min-width: 768px) {
        .profile-card {
          max-width: 900px;
          display: flex;
          align-items: center;
          text-align: left;
          gap: 40px;
          padding: 40px;
        }

        .left {
          flex: 1;
          text-align: center;
        }

        .right {
          flex: 2;
        }

        .buttons {
          margin-top: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <div class="left">
        <img
          src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500"
          alt="Avatar"
          class="avatar"
        />
      </div>

      <div class="right">
        <h1>AK-RIDER</h1>

        <p class="username">
          🎮 Competitive Gamer | BGMI | COD Mobile | Streaming Daily
        </p>

        <div class="buttons">
          <a href="https://www.twitch.tv/" target="_blank" class="btn twitch">
            <i class="bi bi-twitch"></i>
            Twitch
          </a>

          <a href="https://discord.com/" target="_blank" class="btn discord">
            <i class="bi bi-discord"></i>
            Discord
          </a>

          <a
            href="https://store.steampowered.com/"
            target="_blank"
            class="btn steam"
          >
            <i class="bi bi-steam"></i>
            Steam
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
