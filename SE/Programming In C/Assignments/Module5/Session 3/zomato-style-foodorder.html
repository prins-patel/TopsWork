<!doctype html>
<html lang="en">
  <head>
    <title>Zomato Food Order Form</title>
  </head>
  <body>
    <h2>Flipkart Product Review Form</h2>
    <form action="https://httpbin.org/post" method="post">
      <label for="username">Username</label>
      <input
        type="text"
        name="username"
        id="username"
        placeholder="Enter Username..."
        required
      />

      <br /><br />
      <label for="item">Food Item</label>
      <select name="item" id="item" required>
        <option value="" selected disabled>Select Food item</option>
        <option value="Pizza">Margherita Pizza</option>
        <option value="Burger">Veg Burger</option>
        <option value="Pasta">White Sauce Pasta</option>
        <option value="Biryani">Veg Biryani</option>
      </select>
      <br /><br />

      <label for="quantity">Quantity:</label>
      <input
        type="number"
        name="quantity"
        id="quantity"
        min="1"
        max="10"
        placeholder="Enter Quantity"
      />
      <br /><br />

      <label for="instructions">Delivery Instructions:</label>
      <textarea
        name="instructions"
        id="instructions"
        rows="5"
        cols="40"
        placeholder="Enter delivery instructions..."
        required
      ></textarea>

      <br /><br />
      <!-- The disabled attribute prevents users from editing the Order ID because it is automatically generated by the system. This ensures the ID remains accurate and cannot be changed accidentally or intentionally. -->
      <label for="orderid">Order ID:</label><br />
      <input
        type="text"
        id="orderid"
        name="orderid"
        value="ORD12345"
        disabled
      />
      <br /><br />

      <input type="submit" value="Place Order" />
      <input type="reset" value="clear" />
    </form>
  </body>
</html>
